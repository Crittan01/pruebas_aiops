---
- name: Validate Filesystem
  hosts: "{{ target_host | default([]) }}"
  gather_facts: true

  tasks:
    - name: Get filesystem info from facts
      ansible.builtin.set_fact:
        fs_info: "{{ ansible_mounts | selectattr('mount', 'equalto', '/') | first }}"

    - name: Calculate metrics
      ansible.builtin.set_fact:
        size_total_mb: "{{ fs_info.size_total }}"
        size_available_mb: "{{ fs_info.size_available }}"
        size_used_mb: "{{ fs_info.size_total - fs_info.size_available }}"
        percentage_used: "{{ ((fs_info.size_total - fs_info.size_available) / fs_info.size_total * 100) | int }}"

    # ✅ ESTO ES LA MAGIA: set_stats devuelve datos directamente a AWX API
    - name: Return filesystem data via set_stats
      ansible.builtin.set_stats:
        data:
          filesystem_report:
            mount: "{{ fs_info.mount }}"
            device: "{{ fs_info.device }}"
            size_total_mb: "{{ size_total_mb }}"
            size_available_mb: "{{ size_available_mb }}"
            size_used_mb: "{{ size_used_mb }}"
            percentage_used: "{{ percentage_used }}"
